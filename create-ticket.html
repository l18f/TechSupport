<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket | TechSupport</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="brand">
        <span class="brand-icon">TS</span>
        <span class="brand-name">TechSupport</span>
    </a>

    <nav class="main-nav">
        <a href="index.html" data-i18n="home">Home</a>
        <a href="dashboard.html" data-i18n="dashboard">Dashboard</a>
        <a href="create-ticket.html" class="active" data-i18n="createTicket">Create Ticket</a>
        <a href="knowledge-base.html" data-i18n="knowledge">Knowledge Base</a>
        <a href="contact.html" data-i18n="contact">Contact Us</a>
    </nav>

    <div class="nav-actions">
        <button id="languageToggle" class="nav-btn">AR</button>
        <button id="themeToggle" class="nav-btn">☾</button>
    </div>

</header>


<main class="form-page">

    <div class="form-header">

        <span class="hero-badge">TechSupport</span>

        <h1 data-i18n="createTicketTitle">
            Create New Ticket
        </h1>

        <p data-i18n="createTicketSubtitle">
            Tell us about your technical problem
        </p>

    </div>


    <form id="ticketForm" class="main-form">

        <div class="form-row">

            <div>
                <label>Name</label>
                <input
                    type="text"
                    id="ticketName"
                    required>
            </div>

            <div>
                <label>Email</label>
                <input
                    type="email"
                    id="ticketEmail"
                    required>
            </div>

        </div>


        <label>Problem Title</label>

        <input
            type="text"
            id="ticketTitle"
            required>


        <div class="form-row">

            <div>

                <label>Category</label>

                <select id="ticketCategory" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Network">
                        Network
                    </option>

                    <option value="Devices">
                        Devices
                    </option>

                    <option value="Software">
                        Software
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>Priority</label>

                <select id="ticketPriority" required>

                    <option value="">
                        Select Priority
                    </option>

                    <option value="High">
                        High
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>

        </div>


        <label>Description</label>

        <textarea
            id="ticketDescription"
            rows="7"
            required></textarea>


        <button
            type="submit"
            class="btn btn-primary">
            Submit Ticket
        </button>

    </form>

</main>


<footer>
    <p>TechSupport</p>
</footer>


<script src="js/main.js"></script>

</body>
</html>
